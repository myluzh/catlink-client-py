[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catlink-client-py"
version = "26.10.31"
description = "Independent Python client for CATLINK smart pet devices."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "myluzh" }
]
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
]
keywords = ["catlink", "pet", "iot", "client", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/myluzh/catlink-client-py"
Source = "https://github.com/myluzh/catlink-client-py"
Issues = "https://github.com/myluzh/catlink-client-py/issues"

[tool.setuptools.packages.find]
include = ["catlink_client*"]
exclude = ["tests*", "__pycache__*"]
